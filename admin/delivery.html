<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Settings — Flame &amp; Crust Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e11d2e'%3E%3Cpath d='M12 22c4.42 0 8-3.58 8-8 0-3.28-1.84-5.61-3.44-7.11C15.4 5.85 14 4.6 14 2c-2.5 1.5-4 3.5-4 6 0 1.5.5 2.5.5 2.5S9 9.5 8 7.5C6 9.5 4 12 4 14c0 4.42 3.58 8 8 8z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-shell" id="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay" id="admin-overlay"></div>
    <div class="admin-main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content">
        <div class="page-head">
          <div><h2>Delivery Management</h2><p>These values drive checkout charges and delivery estimates.</p></div>
        </div>
        <div class="helper-cards" id="dv-summary"></div>
        <div class="panel">
          <div class="panel-head"><h3>Charges &amp; Timing</h3></div>
          <div class="panel-body">
            <div class="form-row-3">
              <div class="field"><label>Delivery Charges (Rs.)</label><input class="input" type="number" id="dv-fee" min="0"></div>
              <div class="field"><label>Free Delivery Threshold (Rs.)</label><input class="input" type="number" id="dv-free" min="0"><div class="hint">Orders above this get free delivery (0 = never free)</div></div>
              <div class="field"><label>Minimum Order (Rs.)</label><input class="input" type="number" id="dv-min" min="0"></div>
            </div>
            <div class="field"><label>Estimated Delivery Time</label><input class="input" id="dv-est" placeholder="30-40 min"></div>
            <div class="field"><label>Delivery Areas (comma separated — shown as zone dropdown at checkout)</label>
              <textarea class="input" id="dv-areas" rows="2"></textarea></div>
            <button class="btn btn-primary" id="dv-save">Save Delivery Settings</button>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/delivery.js"></script>
</body>
</html>
