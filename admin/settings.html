<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Settings — Flame &amp; Crust Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e11d2e'%3E%3Cpath d='M12 22c4.42 0 8-3.58 8-8 0-3.28-1.84-5.61-3.44-7.11C15.4 5.85 14 4.6 14 2c-2.5 1.5-4 3.5-4 6 0 1.5.5 2.5.5 2.5S9 9.5 8 7.5C6 9.5 4 12 4 14c0 4.42 3.58 8 8 8z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-shell" id="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay" id="admin-overlay"></div>
    <div class="admin-main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content">
        <div class="page-head">
          <div><h2>Restaurant Information</h2><p>Shown across the website header, footer, contact page and invoices.</p></div>
        </div>
        <div class="panel" style="margin-bottom:14px">
          <div class="panel-head"><h3>Business Details</h3></div>
          <div class="panel-body">
            <div class="form-row">
              <div class="field"><label>Restaurant Name <span class="req">*</span></label><input class="input" id="st-name"></div>
              <div class="field"><label>Tagline</label><input class="input" id="st-tagline"></div>
            </div>
            <div class="field"><label>Description</label><textarea class="input" id="st-desc" rows="2"></textarea></div>
            <div class="form-row-3">
              <div class="field"><label>Phone Number</label><input class="input" id="st-phone"></div>
              <div class="field"><label>WhatsApp Number</label><input class="input" id="st-wa"></div>
              <div class="field"><label>Email</label><input class="input" id="st-email"></div>
            </div>
            <div class="form-row">
              <div class="field"><label>Address</label><input class="input" id="st-address"></div>
              <div class="field"><label>Google Maps Link</label><input class="input" id="st-maps" placeholder="https://maps.google.com/..."></div>
            </div>
            <div class="form-row-3">
              <div class="field"><label>Opening Time</label><input class="input" id="st-open" placeholder="11:00 AM"></div>
              <div class="field"><label>Closing Time</label><input class="input" id="st-close" placeholder="01:00 AM"></div>
              <div class="field"><label>Currency Symbol</label><input class="input" id="st-currency"></div>
            </div>
            <div class="form-row-3">
              <div class="field"><label>Facebook URL</label><input class="input" id="st-fb"></div>
              <div class="field"><label>Instagram URL</label><input class="input" id="st-ig"></div>
              <div class="field"><label>Twitter / X URL</label><input class="input" id="st-tw"></div>
            </div>
          </div>
        </div>
        <div class="panel" style="margin-bottom:14px">
          <div class="panel-head"><h3>Weekly Schedule</h3></div>
          <div class="panel-body" id="st-schedule"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Branding</h3></div>
          <div class="panel-body">
            <div class="form-row">
              <div class="field"><label>Logo Image <span class="hint">(optional — replaces the fire icon)</span></label>
                <div class="upload-drop" id="st-logo-drop">Drop or <b>click to upload</b> logo (PNG/SVG, under 900KB)
                  <input type="file" id="st-logo" accept="image/*" hidden>
                  <div class="form-preview" id="st-logo-prev"></div>
                </div>
              </div>
              <div class="field"><label>Favicon <span class="hint">(32×32 PNG works best)</span></label>
                <div class="upload-drop" id="st-fav-drop">Drop or <b>click to upload</b> favicon
                  <input type="file" id="st-fav" accept="image/*" hidden>
                  <div class="form-preview" id="st-fav-prev"></div>
                </div>
              </div>
            </div>
            <button class="btn btn-primary" id="st-save">Save All Settings</button>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
