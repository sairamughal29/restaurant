<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers — Flame &amp; Crust Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e11d2e'%3E%3Cpath d='M12 22c4.42 0 8-3.58 8-8 0-3.28-1.84-5.61-3.44-7.11C15.4 5.85 14 4.6 14 2c-2.5 1.5-4 3.5-4 6 0 1.5.5 2.5.5 2.5S9 9.5 8 7.5C6 9.5 4 12 4 14c0 4.42 3.58 8 8 8z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-shell" id="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay" id="admin-overlay"></div>
    <div class="admin-main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content">
        <div class="page-head">
          <div><h2>Customer Management</h2><p>Everyone who has ordered or registered on the website.</p></div>
          <div class="page-actions"><button class="btn btn-ghost" id="cust-export">Export CSV</button></div>
        </div>
        <div class="toolbar">
          <div class="search"><input class="input" id="cust-search" placeholder="Search by name, email or phone..."></div>
          <div id="cust-filters" style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="chip active" data-s="all">All</button>
            <button class="chip" data-s="active">Active</button>
            <button class="chip" data-s="blocked">Blocked</button>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Customers <span class="sub" id="cust-count"></span></h3></div>
          <div class="panel-body flush table-wrap" id="cust-table"></div>
        </div>
      </main>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/customers.js"></script>
</body>
</html>
