<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Profile — Flame &amp; Crust Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e11d2e'%3E%3Cpath d='M12 22c4.42 0 8-3.58 8-8 0-3.28-1.84-5.61-3.44-7.11C15.4 5.85 14 4.6 14 2c-2.5 1.5-4 3.5-4 6 0 1.5.5 2.5.5 2.5S9 9.5 8 7.5C6 9.5 4 12 4 14c0 4.42 3.58 8 8 8z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-shell" id="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay" id="admin-overlay"></div>
    <div class="admin-main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content">
        <div class="page-head">
          <div><h2>Admin Profile &amp; Security</h2><p>Your account credentials and active session.</p></div>
        </div>
        <div class="dash-row" style="grid-template-columns:1fr 1.4fr;align-items:start">
          <div class="panel">
            <div class="panel-head"><h3>Profile</h3></div>
            <div class="panel-body" id="pf-card"></div>
          </div>
          <div>
            <div class="panel" style="margin-bottom:14px">
              <div class="panel-head"><h3>Change Password</h3></div>
              <div class="panel-body">
                <div class="field"><label>Current Password <span class="req">*</span></label>
                  <div class="pass-wrap"><input type="password" class="input" id="pw-cur" placeholder="••••••••">
                  <button type="button" class="pass-toggle" data-for="pw-cur"></button></div></div>
                <div class="form-row">
                  <div class="field"><label>New Password <span class="req">*</span></label>
                    <div class="pass-wrap"><input type="password" class="input" id="pw-new" placeholder="Min 6 characters">
                    <button type="button" class="pass-toggle" data-for="pw-new"></button></div></div>
                  <div class="field"><label>Confirm New Password <span class="req">*</span></label>
                    <div class="pass-wrap"><input type="password" class="input" id="pw-conf" placeholder="Repeat new password">
                    <button type="button" class="pass-toggle" data-for="pw-conf"></button></div></div>
                </div>
                <button class="btn btn-primary" id="pw-save">Update Password</button>
              </div>
            </div>
            <div class="panel">
              <div class="panel-head"><h3>Session</h3></div>
              <div class="panel-body" id="pf-session"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
