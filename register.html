<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Flame &amp; Crust</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e11d2e'%3E%3Cpath d='M12 22c4.42 0 8-3.58 8-8 0-3.28-1.84-5.61-3.44-7.11C15.4 5.85 14 4.6 14 2c-2.5 1.5-4 3.5-4 6 0 1.5.5 2.5.5 2.5S9 9.5 8 7.5C6 9.5 4 12 4 14c0 4.42 3.58 8 8 8z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <header class="navbar" id="navbar"></header>

  <main class="auth-wrap">
    <div class="card auth-card">
      <div class="auth-logo"><span class="logo-ic" style="width:52px;height:52px" id="auth-logo"></span></div>
      <h1>Create <span class="red">Account</span></h1>
      <p class="auth-sub">Join Flame &amp; Crust for faster checkout, order history and exclusive deals.</p>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="rg-name">Full Name</label>
          <input type="text" id="rg-name" class="input" placeholder="e.g. Ahmed Raza">
          <span class="err-msg">Please enter your name (min 3 characters)</span>
        </div>
        <div class="field">
          <label for="rg-email">Email Address</label>
          <input type="email" id="rg-email" class="input" placeholder="you@example.com">
          <span class="err-msg">Please enter a valid email</span>
        </div>
        <div class="field">
          <label for="rg-phone">Phone Number</label>
          <input type="tel" id="rg-phone" class="input" placeholder="+92 300 1234567">
          <span class="err-msg">Please enter a valid phone number</span>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="rg-pass">Password</label>
            <input type="password" id="rg-pass" class="input" placeholder="Min 6 characters">
            <span class="err-msg">Min 6 characters</span>
          </div>
          <div class="field">
            <label for="rg-pass2">Confirm Password</label>
            <input type="password" id="rg-pass2" class="input" placeholder="Repeat password">
            <span class="err-msg">Passwords do not match</span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Create Account</button>
      </form>

      <div class="auth-foot">Already have an account? <a href="login.html">Login</a></div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>document.getElementById('auth-logo').innerHTML = ICONS.fire;</script>
</body>
</html>
